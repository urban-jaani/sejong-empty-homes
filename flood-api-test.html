<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>세종시 빈집 현황판 · 침수흔적 API 연결 시험</title><style>body{margin:32px auto;padding:0 20px;max-width:1000px;font-family:system-ui,sans-serif;color:#203e36;background:#f4f6f2;line-height:1.7}section{padding:24px;background:white;border:1px solid #d4dfd5;border-radius:10px;margin:18px 0}h1{font-size:26px;color:#21664f}label{display:block;margin-top:14px}input{padding:10px;border:1px solid #aabfb0;border-radius:5px;max-width:90%}input[type=password]{width:480px}button{margin:16px 8px 8px 0;background:#21664f;border:0;color:white;border-radius:5px;padding:12px 18px;cursor:pointer}button:disabled{opacity:.5;cursor:default}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;padding:9px;border-bottom:1px solid #d4dfd5;overflow-wrap:anywhere}th{background:#e8eee6}.scroll{overflow-x:auto}small{color:#526b60}</style></head><body><h1>침수흔적 API 연결 시험</h1><p>승인받은 API의 실제 응답 구조를 확인하는 화면입니다. 먼저 1페이지 10건으로 시험하세요.</p><section><label for="key">재난안전데이터공유플랫폼 인증키</label><input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="이 화면에서만 사용합니다"><label for="page">페이지 번호</label><input id="page" type="number" value="1" min="1"><label for="size">페이지당 건수</label><input id="size" type="number" value="10" min="1" max="1000"><div><button id="run" type="button">API 연결 시험</button><button id="save" type="button" disabled>시험 결과 파일 저장</button></div><p id="status" role="status" aria-live="polite">인증키를 입력하고 시험 버튼을 누르세요.</p><small>인증키는 공식 API 요청에 사용하며 브라우저 저장소와 결과 파일에 넣지 않습니다. 이 화면을 GitHub Pages의 온라인 주소에서 여세요.</small></section><section><h2>응답 확인</h2><div id="summary">아직 조회하지 않았습니다.</div><div class="scroll"><table id="rows"></table></div><p>표에는 최대 20건을 표시하고 결과 파일에는 이번 페이지의 수신 자료를 저장합니다. 침수구역과 빈집의 대조는 전체 조회와 좌표계 확인 후 진행합니다.</p></section><p>출처: <a href="https://www.safetydata.go.kr/disaster-data/view?dataSn=108" target="_blank" rel="noopener">행정안전부 침수흔적도</a></p><script>/* Provider response probe only. No claim of complete coverage or CRS verification. */
(function(root){'use strict';
const ENDPOINT='https://www.safetydata.go.kr/V2/api/DSSP-IF-00117',FIELDS=['SN','FLDN_DOWA','FLDN_GRD','FLDN_AREA','FLDN_YR','FLDN_DST_NM','FLDN_CS_DTL_NM','FLDN_BGNG_YMD','FLDN_END_YMD','FLDN_BGNG_TM','FLDN_END_TM','STDG_CTPV_CD','STDG_SGG_CD','GEOM'];
function inspect(input,page,size,secret=''){
 const candidates=[],totals=[],errors=[],shapes=[];let nodes=0;
 function walk(v,path,depth){if(++nodes>100000||depth>16)throw Error('응답 구조가 너무 큽니다. 페이지당 건수를 줄이세요.');if(Array.isArray(v)){if(v.length&&v.every(r=>r&&typeof r==='object'&&!Array.isArray(r)&&('GEOM'in r||'SN'in r))){candidates.push({path,rows:v});return;}for(let i=0;i<v.length;i++)walk(v[i],path+'[]',depth+1);return;}if(v&&typeof v==='object')for(const[k,x]of Object.entries(v)){if(/^(totalCount|totalCnt|total_count)$/i.test(k)&&/^\d+$/.test(String(x)))totals.push({path:path+'.'+k,value:Number(x)});if(/^(resultCode|resultMsg|returnReasonCode|errCd|errMsg)$/i.test(k)&&!x?.constructor?.name?.includes('Object'))errors.push({field:k,value:String(x).slice(0,500)});walk(x,path+'.'+k,depth+1);}}
 walk(input,'$',0);if(candidates.length>1)throw Error('응답에 여러 데이터 목록이 있습니다. 자동으로 하나를 고르지 않았습니다.');const rows=candidates[0]?.rows||[];if(rows.length>size)throw Error('요청한 페이지 크기보다 많은 행이 반환됐습니다.');const scrub=v=>{let t=String(v??'');if(secret){for(const q of [secret,encodeURIComponent(secret)])t=t.split(q).join('[인증키 제외]');}return t;};const clean=rows.map(r=>Object.fromEntries(FIELDS.filter(k=>k in r).map(k=>[k,scrub(r[k])])));const codes={};for(const r of clean){const c=r.STDG_SGG_CD||'미제공';codes[c]=(codes[c]||0)+1;if(r.GEOM)shapes.push((r.GEOM.match(/^\s*(?:SRID=\d+;)?\s*([A-Z]+)/i)||[])[1]||'미확인');}
 return{format:'sejong-flood-probe',version:1,endpoint:ENDPOINT,queriedAt:new Date().toISOString(),request:{pageNo:page,numOfRows:size,returnType:'json'},rowPath:candidates[0]?.path||null,received:clean.length,sejongRows:clean.filter(r=>r.STDG_SGG_CD==='36110'||r.STDG_CTPV_CD==='36').length,regionCounts:codes,geometryTypes:[...new Set(shapes)],totalFields:totals,messages:errors.map(e=>({field:e.field,value:scrub(e.value)})),rows:clean,coverage:'single-page-only',crs:'not-confirmed'};
}
async function query(key,page,size,send=root.fetch?.bind(root)){
 if(typeof key!=='string'||key.trim().length<10)throw Error('발급받은 인증키를 입력하세요.');if(!Number.isInteger(page)||page<1||!Number.isInteger(size)||size<1||size>1000)throw Error('페이지는 1 이상, 페이지당 건수는 1~1000으로 입력하세요.');key=key.trim();const url=new URL(ENDPOINT);for(const[k,v]of Object.entries({serviceKey:key,returnType:'json',pageNo:page,numOfRows:size}))url.searchParams.set(k,String(v));const c=new AbortController(),timer=setTimeout(()=>c.abort(),25000);try{let response;try{response=await send(url.href,{signal:c.signal,credentials:'omit',referrerPolicy:'no-referrer'});}catch{throw Error(c.signal.aborted?'응답 시간이 초과됐습니다.':'연결되지 않았습니다. 네트워크·등록 IP·브라우저 교차출처 제한을 확인하세요.');}if(!response.ok)throw Error('API 서버 응답 오류 ('+response.status+').');let data;try{data=await response.json();}catch{throw Error('JSON 응답이 아닙니다. 인증·호출 제한을 확인하세요.');}return inspect(data,page,size,key);}finally{clearTimeout(timer);}}
const api={inspect,query};if(typeof module==='object'&&module.exports)module.exports=api;root.FloodProbe=api;
if(!root.document)return;const $=id=>root.document.getElementById(id);let last=null,busy=false;const text=(tag,s)=>{const n=root.document.createElement(tag);n.textContent=s;return n;};
$('run').onclick=async()=>{if(busy)return;busy=true;$('run').disabled=true;$('save').disabled=true;$('status').textContent='침수흔적 API를 1회 조회합니다…';last=null;try{const result=await query($('key').value,Number($('page').value),Number($('size').value));$('key').value='';last=result;$('status').textContent=result.received?'응답 수신 · '+result.received+'건 · 이번 페이지의 세종시 자료 '+result.sejongRows+'건':'응답을 받았지만 데이터 목록을 확인하지 못했습니다. 결과 파일을 저장해 확인하세요.';$('summary').replaceChildren(text('p','이번 조회는 한 페이지입니다. 세종시 0건이어도 전체 자료에 세종시 기록이 없다는 뜻은 아닙니다.'),text('p','목록 위치: '+(result.rowPath||'미확인')+' · 전체 건수 항목: '+(result.totalFields.map(t=>t.value).join(', ')||'미확인')),text('p','지역코드별 수: '+JSON.stringify(result.regionCounts)),text('p','도형 형식: '+(result.geometryTypes.join(', ')||'미확인')+' · 좌표계: 아직 확정하지 않음'));
 const table=$('rows');table.replaceChildren();const h=root.document.createElement('tr');for(const s of ['번호','시군구 코드','침수연도','재해명','도형'])h.append(text('th',s));table.append(h);for(const r of result.rows.slice(0,20)){const tr=root.document.createElement('tr');for(const s of [r.SN,r.STDG_SGG_CD,r.FLDN_YR,r.FLDN_DST_NM,r.GEOM?.slice(0,55)])tr.append(text('td',s||'미제공'));table.append(tr);}$('save').disabled=false;}catch(e){$('status').textContent=e.message;}finally{busy=false;$('run').disabled=false;}};
$('save').onclick=()=>{if(!last)return;const blob=new Blob([JSON.stringify(last,null,2)],{type:'application/json;charset=utf-8'}),u=URL.createObjectURL(blob),a=root.document.createElement('a');a.href=u;a.download='침수흔적_API_조회시험결과.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};
})(typeof window!=='undefined'?window:globalThis);
</script></body></html>
