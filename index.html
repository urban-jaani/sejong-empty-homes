<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>세종시 빈집 현황판</title>
<style>
  body {
    font-family: "Malgun Gothic", sans-serif;
    background-color: #f3f5ef;
    color: #19352f;
    max-width: 1000px;
    margin: 0 auto;
    padding: 50px 24px;
  }

  h1 {
    font-size: 32px;
    color: #21664f;
  }

  h2 {
    margin-top: 40px;
    border-bottom: 2px solid #21664f;
    padding-bottom: 12px;
  }

  p {
    font-size: 17px;
    line-height: 1.8;
  }
.cards {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

.card {
  background: white;
  border: 1px solid #dfe7e1;
  border-radius: 12px;
  padding: 24px;
  flex: 1;
  min-width: 200px;
}

.card strong {
  display: block;
  font-size: 36px;
  color: #21664f;
}
</style>
</head>
<body>
  <h1>세종시 빈집 현황판</h1>
  <p>세종시 빈집은 어디에 많을까?</p>

  <h2>조사 현황</h2>
<p>화면 만들기 연습용 예시 데이터입니다.</p>

<div class="cards">
  <div class="card">
    <span>조사 기록 수</span>
    <strong>100건</strong>
  </div>

  <div class="card">
    <span>조사 지역 수</span>
    <strong>10곳</strong>
  </div>
</div>
</body>
</html>
