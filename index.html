<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>세종시 빈집 현황판</title>

  <style>
  body {
    font-family: "Malgun Gothic", sans-serif;
    background-color: #f3f5ef;
    color: #19352f;
    max-width: 1000px;
    margin: 0 auto;
    padding: 50px 24px;
  }

  h1 {
    font-size: 32px;
    color: #21664f;
  }

  h2 {
    margin-top: 40px;
    border-bottom: 2px solid #21664f;
    padding-bottom: 12px;
  }

  p {
    font-size: 17px;
    line-height: 1.8;
  }
.cards {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

.card {
  background: white;
  border: 1px solid #dfe7e1;
  border-radius: 12px;
  padding: 24px;
  flex: 1;
  min-width: 200px;
}

.card strong {
  display: block;
  font-size: 36px;
  color: #21664f;
}
    table {
  width: 100%;
  border-collapse: collapse;
  background: white;
}

th, td {
  padding: 16px;
  border-bottom: 1px solid #dfe7e1;
  text-align: left;
}

th {
  background: #21664f;
  color: white;
}

td:last-child {
  font-weight: bold;
}
</style>
</head>
<<h2>지역별 조사 현황</h2>
<p>연습용 예시입니다. 아래 세 지역의 합계는 100건입니다.</p>

<table>
  <thead>
    <tr>
      <th>지역</th>
      <th>조사 기록 수</th>
    </tr>
  </thead>

  <tbody>
    <tr>
      <td>조치원읍</td>
      <td>40건</td>
    </tr>
    <tr>
      <td>금남면</td>
      <td>35건</td>
    </tr>
    <tr>
      <td>전의면</td>
      <td>25건</td>
    </tr>
  </tbody>
</table>
  </body>
  <h1>세종시 빈집 현황판</h1>
  <p>세종시 빈집은 어디에 많을까?</p>

  <h2>조사 현황</h2>
  <label for="excelFile">빈집 조사 엑셀 선택</label>
<input type="file" id="excelFile" accept=".xlsx,.xls">

<p id="fileMessage">아직 파일을 선택하지 않았습니다.</p>
<p>화면 만들기 연습용 예시 데이터입니다.</p>

<div class="cards">
  <div class="card">
    <span>조사 기록 수</span>
    <strong>100건</strong>
  </div>

  <div class="card">
    <span>조사 지역 수</span>
    <strong>3곳</strong>
  </div>
</div>
<script>
  const fileInput = document.getElementById("excelFile");
  const message = document.getElementById("fileMessage");

  fileInput.addEventListener("change", function () {
    const file = fileInput.files[0];

    if (!file) {
      message.textContent = "아직 파일을 선택하지 않았습니다.";
      return;
    }

    message.textContent = "선택한 파일: " + file.name;
  });
</script>
</body>
  
</html>
