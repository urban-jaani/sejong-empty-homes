<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>세종시 빈집 현황판</title>

  <style>
    body {
      font-family: "Malgun Gothic", sans-serif;
      background: #f3f5ef;
      color: #19352f;
      max-width: 1000px;
      margin: 0 auto;
      padding: 50px 24px;
    }

    h1 {
      font-size: 32px;
      color: #21664f;
    }

    h2 {
      margin-top: 40px;
      border-bottom: 2px solid #21664f;
      padding-bottom: 12px;
    }

    p {
      line-height: 1.8;
    }

    .cards {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .card {
      background: white;
      border: 1px solid #dfe7e1;
      border-radius: 12px;
      padding: 24px;
      flex: 1;
      min-width: 200px;
    }

    .card strong {
      display: block;
      font-size: 36px;
      color: #21664f;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 16px;
      border-bottom: 1px solid #dfe7e1;
      text-align: left;
    }

    th {
      background: #21664f;
      color: white;
    }
  </style>
</head>

<body>
  <h1>세종시 빈집 현황판</h1>
  <p>세종시 빈집은 어디에 많을까?</p>

  <h2>조사 현황</h2>

  <label for="excelFile">빈집 조사 엑셀 선택</label>
  <input type="file" id="excelFile" accept=".xlsx,.xls">

  <p id="fileMessage" role="status">
    엑셀을 선택하면 자동으로 집계합니다.
  </p>

  <div class="cards">
    <div class="card">
      <span>조사 기록 수</span>
      <strong id="totalCount">—</strong>
    </div>

    <div class="card">
      <span>자료에 있는 지역 수</span>
      <strong id="regionCount">—</strong>
    </div>
  </div>

  <h2>지역별 조사 현황</h2>
  <p>
    첫 번째 시트의 소재지가 있는 행을 한 건으로 셉니다.
    동일 주소의 반복 기록도 포함합니다.
  </p>

  <table>
    <thead>
      <tr>
        <th>지역</th>
        <th>조사 기록 수</th>
      </tr>
    </thead>
    <tbody id="regionTable"></tbody>
  </table>

  <p>
    선택한 엑셀은 브라우저 안에서 처리됩니다.
    다른 방문자에게 공유되지 않으며,
    새로고침하면 다시 선택해야 합니다.
  </p>

  <!-- 엑셀을 읽는 도구 -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <script>
    const fileInput = document.getElementById("excelFile");
    const message = document.getElementById("fileMessage");
    const totalCount = document.getElementById("totalCount");
    const regionCount = document.getElementById("regionCount");
    const regionTable = document.getElementById("regionTable");

    fileInput.addEventListener("change", async function () {
      const file = fileInput.files[0];

      // 이전 결과를 비웁니다.
      totalCount.textContent = "—";
      regionCount.textContent = "—";
      regionTable.replaceChildren();

      if (!file) {
        message.textContent = "엑셀을 선택해 주세요.";
        return;
      }

      fileInput.disabled = true;
      message.textContent = "엑셀을 읽고 있습니다.";

      try {
        if (typeof XLSX === "undefined") {
          throw new Error(
            "엑셀 읽기 도구를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요."
          );
        }

        // 엑셀의 첫 번째 시트를 읽습니다.
        const buffer = await file.arrayBuffer();
        const workbook = XLSX.read(buffer);
        const sheet = workbook.Sheets[workbook.SheetNames[0]];

        const rows = XLSX.utils.sheet_to_json(sheet, {
          header: 1,
          defval: "",
          raw: false
        });

        // '소재지'가 적힌 제목 행을 찾습니다.
        const headerIndex = rows.findIndex(row =>
          row.some(value => String(value).trim() === "소재지")
        );

        if (headerIndex === -1) {
          throw new Error(
            "첫 번째 시트에서 '소재지' 열을 찾지 못했습니다."
          );
        }

        const headers = rows[headerIndex].map(value =>
          String(value).trim()
        );

        const addressIndex = headers.indexOf("소재지");
        const counts = new Map();
        let total = 0;
        let unknown = 0;

        // 소재지에서 읍·면·동 이름을 찾아 집계합니다.
        for (const row of rows.slice(headerIndex + 1)) {
          const address = String(row[addressIndex] ?? "").trim();

          if (!address) continue;

          total++;

          const match = address.match(
            /세종특별자치시\s+([가-힣]+(?:읍|면|동))(?=\s|$)/
          );

          if (!match) {
            unknown++;
            continue;
          }

          const region = match[1];
          counts.set(region, (counts.get(region) || 0) + 1);
        }

        // 카드에 합계를 표시합니다.
        totalCount.textContent = total.toLocaleString() + "건";
        regionCount.textContent = counts.size + "곳";

        // 건수가 많은 지역부터 표에 표시합니다.
        const sorted = [...counts.entries()].sort(
          (a, b) => b[1] - a[1]
        );

        if (unknown > 0) {
          sorted.push(["지역 확인 필요", unknown]);
        }

        for (const [region, count] of sorted) {
          const tr = document.createElement("tr");
          const nameCell = document.createElement("td");
          const countCell = document.createElement("td");

          nameCell.textContent = region;
          countCell.textContent = count.toLocaleString() + "건";

          tr.append(nameCell, countCell);
          regionTable.append(tr);
        }

        message.textContent =
          file.name + " · 집계 완료" +
          (unknown ? " · 지역 확인 필요 " + unknown + "건" : "");

      } catch (error) {
        message.textContent = "읽기 실패: " + error.message;
      } finally {
        fileInput.disabled = false;
      }
    });
  </script>
</body>
</html>
