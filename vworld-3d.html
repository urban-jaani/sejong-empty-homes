<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>세종시 빈집 3D 지도</title><link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/nanum-square-neo.css">
<style>html,body,#vmap{width:100%;height:100%;margin:0;overflow:hidden}body{font:12px/1.6 NanumSquareNeoVariable,NanumSquareNeo,'Malgun Gothic',sans-serif;background:#edf3ee}#viewerNotice{position:absolute;left:12px;top:12px;right:12px;z-index:10;padding:9px 12px;background:#fffffff0;border-radius:5px;pointer-events:none}#viewerControls{position:absolute;left:12px;bottom:34px;z-index:10;display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#fffffff0;padding:7px;border-radius:5px}button,select{padding:5px 9px;border:1px solid #bfcfc3;border-radius:4px;background:#fff;color:#21664f;font:inherit;cursor:pointer}#selectedLabel{font-weight:bold;overflow-wrap:anywhere}#viewerControls label{white-space:nowrap}
#viewerNotice{font-size:11px;backdrop-filter:blur(8px);box-shadow:0 2px 12px #172b2320}#viewerControls{right:12px;max-width:950px;font-size:11px;border:1px solid #ffffff80;backdrop-filter:blur(10px);box-shadow:0 4px 20px #172b2320}#buildingStats3D{flex-basis:100%;font-size:10px;color:#536459;border-top:1px solid #dbe5dd;padding-top:4px}select{max-width:160px}#selectedLabel{font-size:11px}
</style></head>
<body><div id="vmap" aria-label="브이월드 3차원 지도"></div><div id="viewerNotice" role="status">3D 지도를 준비합니다.</div><div id="viewerControls"><button type="button" id="zoomIn3D" aria-label="3D 지도 확대">＋</button><button type="button" id="zoomOut3D" aria-label="3D 지도 축소">−</button><select id="buildingStyle3D" aria-label="건물 표현 방식"><option value="white">흰색 입체건물</option><option value="original">브이월드 원본 건물</option></select><label><input id="showBuildings3D" type="checkbox" checked>건물 표시</label><select id="buildingRadius3D" aria-label="주변 건물 표시 범위"><option value="500">주변 500m</option><option value="1000" selected>주변 1km</option><option value="2000">주변 2km</option></select><button id="refreshBuildings3D" type="button">주변 건물 갱신</button><span id="selectedLabel"></span><span id="buildingStats3D" role="status"></span></div>
<!-- Parser-time loading is required by the official WebGL SDK. No key in this page URL. -->
<script src="./vworld-3d-viewer.js"></script></body></html>
